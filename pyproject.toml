[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-repo-agent"
version = "0.1.0"
description = "Chat with any GitHub repository — a long-context codebase agent powered by Crusoe Managed Inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Emmanuel Acheampong" }]
keywords = ["agent", "langchain", "crusoe", "codebase", "repository", "llm"]
dependencies = [
    "langchain-crusoe>=0.1.1",
    "langgraph>=0.2.60,<0.4",
    "rich>=13.0",
]

[project.scripts]
deep-repo-agent = "deep_repo_agent.cli:main"

[project.urls]
Repository = "https://github.com/acheamponge/deep-repo-agent"

[tool.hatch.build.targets.wheel]
packages = ["deep_repo_agent"]
